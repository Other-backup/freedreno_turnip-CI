name: Build Turnip A8xx Ultimate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools
          pip3 install --break-system-packages meson mako

      - name: Setup Environment
        run: |
          mkdir -p turnip_workdir
          
          if [ -f tu_gen8.patch ]; then
             echo "Patch found."
          else
             echo "ERROR: tu_gen8.patch required!"
             exit 1
          fi

          chmod +x build_a8xx_custom.sh

      - name: Build Driver
        run: ./build_a8xx_custom.sh

      - name: Generate Release Metadata
        id: meta
        run: |
          echo "TAG_NAME=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "RELEASE_NAME=Turnip A8xx Ultimate 1.4 - $(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Drivers-Pack
          path: turnip_workdir/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            **Turnip A8xx Ultimate (Unrestricted)**
            
            * **Base:** Mesa Main
            * **Patch:** `tu_gen8.patch` (A8xx Support + Timeline Hack)
            * **Vulkan:** Forced 1.4.340
            * **Unlock:** Force Enables ALL Features (1.1, 1.2, 1.3).
          files: turnip_workdir/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
