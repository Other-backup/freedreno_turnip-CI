name: Build Freedreno KGSL (Winlator GLX)

on:
  workflow_dispatch: # Permite rodar manualmente no painel do GitHub

jobs:
  build:
    runs-on: ubuntu-24.04
    
    env:
      NDK_VER: "android-ndk-r26c" # Versão estável do NDK
      API_LEVEL: "28" # Necessário para suporte a AHardwareBuffer
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Instalamos as ferramentas de sistema, mas deixamos o meson para o pip3
          sudo apt-get install -y ninja-build flex bison python3-pip curl unzip pkg-config
          # Garante o Meson >= 1.4.0 exigido pelas versões recentes do Mesa
          pip3 install meson mako --break-system-packages

      - name: Download and Setup Android NDK
        run: |
          cd $GITHUB_WORKSPACE
          curl -sLO https://dl.google.com/android/repository/${NDK_VER}-linux.zip
          unzip -q ${NDK_VER}-linux.zip
          echo "NDK_HOME=$GITHUB_WORKSPACE/${NDK_VER}" >> $GITHUB_ENV

      - name: Clone Mesa
        run: |
          git clone --depth 1 -b main https://gitlab.freedesktop.org/mesa/mesa.git
          
      - name: Setup libdrm Fallback
        run: |
          # O Freedreno OpenGL precisa do libdrm, que não existe nativamente no NDK
          mkdir -p mesa/subprojects
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/drm.git mesa/subprojects/libdrm

      - name: Apply KGSL Patch
        run: |
          cd mesa
          # Certifica-te de que tens o ficheiro 0014-freedreno-kgsl-experimental.patch na pasta 'patches'
          patch -p1 < ../patches/0014-freedreno-kgsl-experimental.patch

      - name: Setup Meson Cross-File
        run: |
          # Configura o ficheiro de compilação cruzada para o compilador do NDK
          cat <<EOF > mesa/android-aarch64.txt
          [binaries]
          ar = '$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          c = ['ccache', '$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API_LEVEL}-clang']
          cpp = ['ccache', '$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API_LEVEL}-clang++']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=$NDK_HOME/pkg-config', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Configure Build (Meson)
        run: |
          cd mesa
          # Ativa suporte Android, KGSL e define o libdrm como fallback interno
          meson setup build --cross-file android-aarch64.txt \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=${API_LEVEL} \
            -Dandroid-stub=true \
            -Dgallium-drivers=freedreno \
            -Dvulkan-drivers= \
            -Dfreedreno-kmds=kgsl \
            -Degl=enabled \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dopengl=true \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dshared-glapi=enabled \
            --force-fallback-for=libdrm
            
      - name: Compile
        run: |
          cd mesa
          ninja -C build

      - name: Collect Artifacts
        run: |
          mkdir -p freedreno-libs
          # Bibliotecas necessárias para carregar via dlopen no Winlator
          cp mesa/build/src/egl/libEGL_mesa.so freedreno-libs/
          cp mesa/build/src/mapi/es2api/libGLESv2_mesa.so freedreno-libs/
          cp mesa/build/src/mapi/shared-glapi/libglapi.so freedreno-libs/
          # Procura e copia o driver Gallium (msm_kgsl_dri.so)
          find mesa/build -name "*_dri.so" -exec cp {} freedreno-libs/ \;
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freedreno-kgsl-libs
          path: freedreno-libs/
