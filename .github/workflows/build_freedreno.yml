name: Build Freedreno KGSL (Winlator GLX)

on:
  workflow_dispatch: # Permite rodar manualmente no painel do GitHub

jobs:
  build:
    runs-on: ubuntu-24.04
    
    env:
      NDK_VER: "android-ndk-r26c"
      API_LEVEL: "28"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build flex bison python3-pip curl unzip pkg-config
          pip3 install meson mako --break-system-packages

      - name: Setup Android NDK
        run: |
          cd $GITHUB_WORKSPACE
          curl -sLO https://dl.google.com/android/repository/${NDK_VER}-linux.zip
          unzip -q ${NDK_VER}-linux.zip
          # Exporta o NDK_HOME e adiciona o compilador do NDK direto no PATH do sistema
          echo "NDK_HOME=$GITHUB_WORKSPACE/${NDK_VER}" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/${NDK_VER}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Cross-File and Env
        run: |
          # Cria a pasta onde o libdrm será instalado localmente
          mkdir -p $GITHUB_WORKSPACE/prefix
          
          # Arquivo limpo do compilador cruzado com correção para o LLD 17+ (undefined-version)
          cat <<EOF > $GITHUB_WORKSPACE/android-aarch64.txt
          [binaries]
          c = 'aarch64-linux-android${API_LEVEL}-clang'
          cpp = 'aarch64-linux-android${API_LEVEL}-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          
          [built-in options]
          c_link_args = ['-Wl,--undefined-version']
          cpp_link_args = ['-Wl,--undefined-version']
          EOF
          
          # Força o pkg-config a buscar dependências APENAS no nosso prefixo (onde a libdrm vai ficar)
          echo "PKG_CONFIG_LIBDIR=$GITHUB_WORKSPACE/prefix/lib/pkgconfig:$GITHUB_WORKSPACE/prefix/lib/aarch64-linux-android/pkgconfig:$GITHUB_WORKSPACE/prefix/share/pkgconfig" >> $GITHUB_ENV

      - name: Build and Install libdrm
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/drm.git libdrm
          cd libdrm
          
          # Compila a libdrm habilitando apenas o driver Freedreno
          meson setup build --cross-file ../android-aarch64.txt \
            --prefix=$GITHUB_WORKSPACE/prefix \
            -Dintel=disabled \
            -Dradeon=disabled \
            -Damdgpu=disabled \
            -Dnouveau=disabled \
            -Dvmwgfx=disabled \
            -Domap=disabled \
            -Dexynos=disabled \
            -Dfreedreno=enabled \
            -Dtegra=disabled \
            -Detnaviv=disabled \
            -Dcairo-tests=disabled \
            -Dman-pages=disabled \
            -Dvalgrind=disabled \
            -Dtests=false
            
          ninja -C build install

      - name: Clone and Patch Mesa
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 -b main https://gitlab.freedesktop.org/mesa/mesa.git
          cd mesa
          
          # Aplica o patch KGSL (certifique-se que o patch está em patches/0014-freedreno-kgsl-experimental.patch)
          patch -p1 < ../patches/0014-freedreno-kgsl-experimental.patch

      - name: Configure and Build Mesa
        run: |
          cd $GITHUB_WORKSPACE/mesa
          
          # Agora o Mesa vai encontrar a libdrm através do pkg-config configurado ali em cima
          meson setup build --cross-file ../android-aarch64.txt \
            --prefix=$GITHUB_WORKSPACE/prefix \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=${API_LEVEL} \
            -Dandroid-stub=true \
            -Dgallium-drivers=freedreno \
            -Dvulkan-drivers= \
            -Dfreedreno-kmds=kgsl \
            -Degl=enabled \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dopengl=true \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dshared-glapi=enabled
            
          ninja -C build

      - name: Collect Artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/freedreno-libs
          cd $GITHUB_WORKSPACE/mesa/build
          
          # Copia os .so para o zip final. Usa '|| true' para não falhar caso a estrutura mude nas versões
          cp src/egl/libEGL_mesa.so $GITHUB_WORKSPACE/freedreno-libs/ || true
          cp src/mapi/es2api/libGLESv2_mesa.so $GITHUB_WORKSPACE/freedreno-libs/ || true
          cp src/mapi/shared-glapi/libglapi.so $GITHUB_WORKSPACE/freedreno-libs/ || true
          find . -name "*_dri.so" -exec cp {} $GITHUB_WORKSPACE/freedreno-libs/ \;
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freedreno-kgsl-libs
          path: freedreno-libs/
