name: Build Freedreno KGSL libs

on:
  workflow_dispatch:

jobs:
  build-freedreno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config python3-mako libdrm-dev libexpat1-dev

      - name: Configure and Build Mesa
        run: |
          meson setup build-mesa \
            -Dplatforms=android \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dbuildtype=release \
            -Dshared-glapi=enabled \
            -Dllvm=disabled
          ninja -C build-mesa

      - name: Collect Artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/freedreno-libs
          cd build-mesa
          find . -name "libEGL_mesa.so" -exec cp -L {} $GITHUB_WORKSPACE/freedreno-libs/ \;
          find . -name "libGLESv2_mesa.so" -exec cp -L {} $GITHUB_WORKSPACE/freedreno-libs/ \;
          find . -name "libvulkan_freedreno.so" -exec cp -L {} $GITHUB_WORKSPACE/freedreno-libs/ \;
          find . \( -name "libglapi.so" -o -name "libglapi.so.*" \) -exec cp -L {} $GITHUB_WORKSPACE/freedreno-libs/ \;
          cd $GITHUB_WORKSPACE/freedreno-libs
          [ -f libglapi.so.0 ] && ln -sf libglapi.so.0 libglapi.so || true
          [ -f libglapi.so.0.0.0 ] && ln -sf libglapi.so.0.0.0 libglapi.so.0 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freedreno-libs
          path: freedreno-libs/
